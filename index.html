<!DOCTYPE html>
<html lang="en">
<head>
  <title>VisionStack AR</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }

    #start {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      z-index: 10;
    }

    #hud {
      display: none;
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.6);
      padding: 12px 18px;
      border-radius: 12px;
      color: white;
      font-size: 14px;
    }

    button#ar-button {
      margin-top: 20px !important;
      padding: 14px 32px !important;
      border-radius: 50px !important;
      font-weight: bold !important;
      border: none !important;
    }
  </style>
</head>

<body>

<div id="start">
  <h1>VisionStack</h1>
  <p>AI-Optimized Loading Assistant</p>
</div>

<div id="hud"><span id="status">Initializing…</span></div>

<script type="module">
import { ARButton } from "https://unpkg.com/three@0.128.0/examples/jsm/webxr/ARButton.js";

/* 🔗 CHANGE ONLY THIS */
const NGROK_BASE = "https://d97064b994b6.ngrok-free.app";

const POST_PACK = `${NGROK_BASE}/pack`;
const GET_PACK  = `${NGROK_BASE}/latest-pack`;

const SCALE = 0.05;

let scene, camera, renderer;
let reticle, hitTestSource = null, hitTestRequested = false;
let stackGroup = null;
let boxData = [];
let backendReady = false;

/* ---------- INIT ---------- */
init();
renderer.setAnimationLoop(render);

function init() {
  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1));
  const dir = new THREE.DirectionalLight(0xffffff, 0.8);
  dir.position.set(3, 10, 10);
  scene.add(dir);

  renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.xr.enabled = true;
  document.body.appendChild(renderer.domElement);

  const arBtn = ARButton.createButton(renderer, { requiredFeatures: ["hit-test"] });
  arBtn.id = "ar-button";
  document.getElementById("start").appendChild(arBtn);

  reticle = new THREE.Mesh(
    new THREE.RingGeometry(0.1, 0.11, 32).rotateX(-Math.PI / 2),
    new THREE.MeshBasicMaterial({ color: 0xffffff })
  );
  reticle.matrixAutoUpdate = false;
  reticle.visible = false;
  scene.add(reticle);

  const controller = renderer.xr.getController(0);
  controller.addEventListener("select", placeStack);
  scene.add(controller);

  window.addEventListener("resize", onResize);
}

/* ---------- BACKEND FLOW ---------- */
async function computePack() {
  setStatus("Computing packing…");

  await fetch(POST_PACK, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      bin: [10,10,10],
      items: [
        [3,4,2],
        [2,2,2],
        [4,3,3]
      ]
    })
  });

  await loadLatestPack();
}

async function loadLatestPack() {
  const res = await fetch(GET_PACK);
  const data = await res.json();

  boxData = data.packed_items.map(i => ({
    pos: i.position.map(v => v * SCALE),
    size: i.dimensions.map(v => v * SCALE)
  }));

  backendReady = true;
  setStatus("Tap to place");
}

/* ---------- PLACE STACK ---------- */
function placeStack() {
  if (!reticle.visible || !backendReady) return;

  if (stackGroup) scene.remove(stackGroup);
  stackGroup = new THREE.Group();
  stackGroup.position.setFromMatrixPosition(reticle.matrix);
  scene.add(stackGroup);

  boxData.forEach(b => {
    const g = new THREE.BoxGeometry(...b.size);
    const m = new THREE.MeshStandardMaterial({ color: 0x4aa3ff });
    const mesh = new THREE.Mesh(g, m);

    mesh.position.set(
      b.pos[0] + b.size[0]/2,
      b.pos[1] + b.size[1]/2,
      b.pos[2] + b.size[2]/2
    );

    stackGroup.add(mesh);
  });

  setStatus("Placed");
}

/* ---------- RENDER ---------- */
function render(_, frame) {
  if (frame) {
    const refSpace = renderer.xr.getReferenceSpace();
    const session = renderer.xr.getSession();

    if (!hitTestRequested) {
      session.requestReferenceSpace("viewer").then(space => {
        session.requestHitTestSource({ space }).then(src => hitTestSource = src);
      });

      document.getElementById("start").style.display = "none";
      document.getElementById("hud").style.display = "block";

      computePack(); // 🔥 POST + GET happens HERE

      hitTestRequested = true;
    }

    if (hitTestSource) {
      const hits = frame.getHitTestResults(hitTestSource);
      if (hits.length) {
        reticle.visible = true;
        reticle.matrix.fromArray(hits[0].getPose(refSpace).transform.matrix);
      } else {
        reticle.visible = false;
      }
    }
  }

  renderer.render(scene, camera);
}

/* ---------- HELPERS ---------- */
function setStatus(t) {
  document.getElementById("status").innerText = t;
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}
</script>

</body>
</html>
