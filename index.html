<!DOCTYPE html>
<html lang="en">
<head>
  <title>VisionStack AR</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }
    #start {
      position: absolute; inset: 0;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      color: white; z-index: 10;
    }
    #hud {
      display: none; position: absolute;
      bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.8); padding: 12px 18px;
      border-radius: 12px; color: white; font-size: 14px;
      text-align: center; white-space: nowrap;
    }
    button#ar-button {
      margin-top: 20px !important; padding: 14px 32px !important;
      border-radius: 50px !important; font-weight: bold !important; border: none !important;
    }
    .error-msg { color: #ff6b6b; margin-top: 10px; font-size: 12px; }
  </style>
</head>

<body>

<div id="start">
  <h1>VisionStack</h1>
  <p>AI-Optimized Loading Assistant</p>
  <p id="connection-status" class="error-msg"></p>
</div>

<div id="hud"><span id="status">Initializing…</span></div>

<script type="module">
import { ARButton } from "https://unpkg.com/three@0.128.0/examples/jsm/webxr/ARButton.js";

/* 🔗 CHANGE THIS TO YOUR EXACT NGROK URL */
const NGROK_BASE = "https://7e2ac16033a6.ngrok-free.app"; 

const GET_PACK  = `${NGROK_BASE}/latest-pack`;
const SCALE = 0.05; // 1 unit = 5cm in AR

let scene, camera, renderer;
let reticle, hitTestSource = null, hitTestRequested = false;
let stackGroup = null;
let boxData = [];
let backendReady = false;

init();
renderer.setAnimationLoop(render);

function init() {
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

  // Lighting to match the "Dark Mode" aesthetic of your dashboard
  scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 0.8));
  const dir = new THREE.DirectionalLight(0xffffff, 1);
  dir.position.set(5, 10, 7);
  scene.add(dir);

  renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.xr.enabled = true;
  document.body.appendChild(renderer.domElement);

  // Add AR Button
  const arBtn = ARButton.createButton(renderer, { requiredFeatures: ["hit-test"] });
  arBtn.id = "ar-button";
  document.getElementById("start").appendChild(arBtn);

  // Reticle (The white ring)
  reticle = new THREE.Mesh(
    new THREE.RingGeometry(0.1, 0.11, 32).rotateX(-Math.PI / 2),
    new THREE.MeshBasicMaterial({ color: 0xffffff })
  );
  reticle.matrixAutoUpdate = false;
  reticle.visible = false;
  scene.add(reticle);

  const controller = renderer.xr.getController(0);
  controller.addEventListener("select", placeStack);
  scene.add(controller);

  window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
  
  // Pre-check connection for better UX
  checkConnection();
}

async function checkConnection() {
    try {
        const res = await fetch(GET_PACK, { 
            headers: { "ngrok-skip-browser-warning": "true" } 
        });
        if(res.ok) {
            document.getElementById("connection-status").innerText = "• Connected to Backend";
            document.getElementById("connection-status").style.color = "#4ade80";
        }
    } catch(e) {
        document.getElementById("connection-status").innerText = "• Cannot reach Backend";
    }
}

/* ---------- SYNC WITH BACKEND ---------- */
async function computePack() {
  setStatus("Syncing with Dashboard...");

  try {
    // GET request to retrieve the data currently in LATEST_PACK
    const getRes = await fetch(GET_PACK, {
      headers: { 
        "ngrok-skip-browser-warning": "true" 
      }
    });

    if (!getRes.ok) throw new Error(`Server Error: ${getRes.status}`);

    const data = await getRes.json();
    console.log("Data received:", data);

    // Handle case where user hasn't generated anything on PC yet
    if (data.error || !data.packed_items || data.packed_items.length === 0) {
      setStatus("No Pack Found. Generate on PC first.");
      return; 
    }

    // Process Data
    boxData = data.packed_items.map(i => ({
      pos: i.position.map(v => v * SCALE),
      size: i.dimensions.map(v => v * SCALE)
    }));

    backendReady = true;
    setStatus(`Ready: ${boxData.length} Items. Tap to Place.`);

  } catch (err) {
    console.error(err);
    setStatus("Error: " + err.message);
  }
}

/* ---------- RENDER BOXES ---------- */
function placeStack() {
  if (!reticle.visible) return;
  
  if (!backendReady) {
    setStatus("Retrying Sync...");
    computePack(); 
    return;
  }

  if (stackGroup) scene.remove(stackGroup);
  stackGroup = new THREE.Group();
  stackGroup.position.setFromMatrixPosition(reticle.matrix);
  scene.add(stackGroup);

  // Generate boxes matching the backend data
  boxData.forEach((b, index) => {
    const geometry = new THREE.BoxGeometry(...b.size);
    
    // Cycle through distinct colors to mimic the dashboard
    const colors = [0x00FFFF, 0xFF00FF, 0xFFFF00, 0xFF0000, 0x00FF00, 0x0000FF];
    const color = colors[index % colors.length];

    const material = new THREE.MeshStandardMaterial({ 
      color: color,
      roughness: 0.3,
      metalness: 0.1,
      transparent: true,
      opacity: 0.9
    });
    
    const mesh = new THREE.Mesh(geometry, material);

    // THREE.js positions from center, Backend positions from corner
    // We adjust by +size/2 to align them perfectly
    mesh.position.set(
      b.pos[0] + b.size[0] / 2,
      b.pos[1] + b.size[1] / 2,
      b.pos[2] + b.size[2] / 2
    );

    // Black edges for visibility
    const edges = new THREE.LineSegments(
      new THREE.EdgesGeometry(geometry),
      new THREE.LineBasicMaterial({ color: 0x000000 })
    );
    mesh.add(edges);

    stackGroup.add(mesh);
  });

  setStatus("Stack Placed");
}

/* ---------- AR LOOP ---------- */
function render(_, frame) {
  if (frame) {
    const session = renderer.xr.getSession();

    if (!hitTestRequested) {
      session.requestReferenceSpace("viewer").then(space => {
        session.requestHitTestSource({ space }).then(src => hitTestSource = src);
      });

      document.getElementById("start").style.display = "none";
      document.getElementById("hud").style.display = "block";

      // FETCH DATA ONCE UPON START
      computePack(); 
      
      hitTestRequested = true;
    }

    if (hitTestSource) {
      const refSpace = renderer.xr.getReferenceSpace();
      const hits = frame.getHitTestResults(hitTestSource);
      
      if (hits.length) {
        reticle.visible = true;
        const hitPose = hits[0].getPose(refSpace);
        reticle.matrix.fromArray(hitPose.transform.matrix);
      } else {
        reticle.visible = false;
      }
    }
  }
  renderer.render(scene, camera);
}

function setStatus(text) {
  document.getElementById("status").innerText = text;
}
</script>

</body>
</html>
